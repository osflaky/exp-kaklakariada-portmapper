name: Java CI

on:
  workflow_dispatch:

jobs:
  matrix-build:
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - java: 21
          os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-21-arm64
    env:
      DEFAULT_JAVA: 17 # Sonar requires at least Java 17

    steps:

    - uses: actions/checkout@v6

    - name: Cache SonarQube packages
      uses: actions/cache@v5
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-java-${{ matrix.java }}-sonar
        restore-keys: ${{ runner.os }}-java-${{ matrix.java }}-sonar

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        # Temurin publishes no JDK 11 build for Windows on ARM64; Microsoft Build of OpenJDK does
        distribution: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64' && matrix.java == 11) && 'microsoft' || 'temurin' }}
        java-version: ${{ matrix.java }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build with Gradle
      run: ./gradlew build --info --warning-mode all -PjavaVersion=${{ 
        matrix.java }}

    - name: Sonar analysis
      if: ${{ env.DEFAULT_JAVA == matrix.java && env.SONAR_TOKEN != null }}
      run: ./gradlew sonarqube -Dsonar.token=$SONAR_TOKEN --info --warning-mode 
        all
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Archive portmapper binary
      uses: actions/upload-artifact@v7
      if: ${{ env.DEFAULT_JAVA == matrix.java }}
      with:
        name: portmapper
        path: build/libs/portmapper-*-all.jar

    name: matrix-build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
